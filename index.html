<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Чит-коды GTA</title>
  <meta name="description" content="Чит-коды GTA 5 и прогноз GTA 6 для PlayStation, Xbox, ПК и телефона в игре.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Чит-коды">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Онбординг: игра → платформа -->
  <div id="onboarding"></div>

  <!-- Основное приложение -->
  <main id="main">
    <section class="view on" id="view-home">
      <header class="hdr">
        <h1 id="home-title">GTA 5</h1>
        <button class="plat-btn" id="plat-btn" data-action="plat" aria-label="platform"></button>
      </header>
      <div id="home-banner"></div>
      <nav class="segs" id="segs"></nav>
      <div class="pager" id="pager"></div>
    </section>

    <section class="view" id="view-search">
      <header class="hdr"><h1 id="search-title">Поиск</h1></header>
      <div class="search-box">
        <input id="search-input" type="search" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <button class="search-x" data-action="search-clear" aria-label="clear">×</button>
      </div>
      <div class="scroll" id="search-results"></div>
    </section>

    <section class="view" id="view-fav">
      <header class="hdr"><h1 id="fav-title">Избранное</h1></header>
      <div class="scroll" id="fav-list"></div>
    </section>

    <section class="view" id="view-settings">
      <header class="hdr"><h1 id="settings-title">Настройки</h1></header>
      <div class="scroll" id="settings-body"></div>
    </section>

    <nav class="tabbar">
      <button class="tab on" data-action="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-k="home">Главная</span></button>
      <button class="tab" data-action="tab" data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span data-k="search">Поиск</span></button>
      <button class="tab" data-action="tab" data-tab="fav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.8 3.9 4.5 7.3 4.5c2 0 3.6 1.1 4.7 2.7 1.1-1.6 2.7-2.7 4.7-2.7 3.4 0 5.7 3.3 4.5 6.7-1.7 4.7-9.2 9.3-9.2 9.3z"/></svg><span data-k="fav">Избранное</span></button>
      <button class="tab" data-action="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span data-k="settings">Настройки</span></button>
    </nav>
  </main>

  <!-- Шторка (чит, выбор игры/платформы) -->
  <div id="sheet-layer">
    <div class="sheet" id="sheet">
      <div class="grab"><i></i></div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <!-- Пейвол -->
  <div id="paywall"></div>

  <div id="install"></div>
  <div id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
